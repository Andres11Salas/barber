<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Barbería VIP</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c9a84c;
            --accent-light: #e8c65a;
            --gold-gradient: linear-gradient(135deg, #c9a84c, #e8c65a, #c9a84c);
            --bg-dark: #111;
            --bg-card: #1a1a1a;
            --text-light: #f0f0f0;
            --text-muted: #999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-light); }
        .header { background: linear-gradient(180deg,#0a0a0a 0%,#1a1a2e 100%); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 22px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs-container { background: #0a0a0a; border-bottom: 1px solid #222; padding: 0 15px; display: flex; gap: 3px; position: sticky; top: 56px; z-index: 99; overflow-x: auto; }
        .tab-btn { padding: 12px 16px; border: none; background: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent; transition: 0.2s; font-size: 14px; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }
        .tab-btn:hover { color: var(--accent); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .container { max-width: 1200px; margin: 0 auto; padding: 25px 15px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        h2 { font-family: 'Oswald', sans-serif; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid rgba(201,168,76,0.1); margin-top: 15px; }
        thead { background: #0a0a0a; }
        th { padding: 12px 15px; text-align: left; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
        td { padding: 12px 15px; border-bottom: 1px solid #222; font-size: 14px; }
        tbody tr:hover { background: rgba(201,168,76,0.05); }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background: var(--gold-gradient); color: #000; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #e67e22; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-adm { background: #c0392b; color: white; }
        .badge-barbero { background: var(--accent); color: #000; }
        .badge-cliente { background: #3498db; color: white; }
        .card { background: var(--bg-card); border-radius: 10px; border: 1px solid rgba(201,168,76,0.1); padding: 18px; margin-bottom: 20px; }
        .no-data { text-align: center; padding: 30px; color: #666; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #222; color: #f0f0f0; font-size: 14px; margin: 5px 0 12px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(201,168,76,0.15); }
        label { display: block; font-weight: 600; margin-bottom: 3px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .field-error { color: #e74c3c; font-size: 12px; margin-top: 2px; display: block; }
        .wrap-btn { display: flex; gap: 5px; flex-wrap: wrap; }
        @media (max-width:768px) { .header{flex-direction:column;gap:8px;text-align:center} .tabs-container{top:90px} th,td{padding:8px 8px;font-size:12px} }
    </style>
</head>
<body>
<div class="header">
    <h1>💈 Barbería VIP</h1>
    <div><span style="color:var(--accent);font-weight:600;font-size:14px;" id="badge-rol"></span><button class="btn btn-danger btn-small" onclick="cerrarSesion()">Salir</button></div>
</div>
<div class="tabs-container">
    <button class="tab-btn active" onclick="mostrarSeccion('usuarios',this)">👥 Usuarios</button>
    <button class="tab-btn" onclick="mostrarSeccion('servicios',this)">✂️ Servicios</button>
    <button class="tab-btn" onclick="mostrarSeccion('citas',this)">📅 Citas</button>
</div>
<div class="container">
    <div id="sec-usuarios" class="section active">
        <h2>👥 Gestión de Usuarios</h2>
        <div class="card" style="max-width:500px;">
            <h3 style="color:var(--accent);margin-bottom:10px;">➕ Nuevo Usuario</h3>
            <label>Nombre</label><input type="text" id="usr-nombre"><span class="field-error" id="err-usr-nombre"></span>
            <label>Email</label><input type="email" id="usr-email"><span class="field-error" id="err-usr-email"></span>
            <label>Contraseña</label><input type="password" id="usr-password"><span class="field-error" id="err-usr-password"></span>
            <label>Rol</label><select id="usr-rol"><option value="CLIENTE">Cliente</option><option value="BARBERO">Barbero</option><option value="ADM">Admin</option></select>
            <button class="btn btn-primary" onclick="crearUsuario()">Crear</button>
        </div>
        <table><thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tabla-usuarios"><tr><td colspan="6" class="no-data">Cargando...</td></tr></tbody></table>
    </div>
    <div id="sec-servicios" class="section">
        <h2>✂️ Gestión de Servicios</h2>
        <div class="card" style="max-width:500px;">
            <h3 style="color:var(--accent);margin-bottom:10px;">➕ Nuevo Servicio</h3>
            <label>Nombre</label><input type="text" id="srv-nombre"><span class="field-error" id="err-srv-nombre"></span>
            <label>Descripción</label><textarea id="srv-descripcion"></textarea><span class="field-error" id="err-srv-descripcion"></span>
            <label>Precio ($)</label><input type="number" step="0.01" id="srv-precio"><span class="field-error" id="err-srv-precio"></span>
            <label>Duración (minutos)</label><input type="number" id="srv-duracion"><span class="field-error" id="err-srv-duracion"></span>
            <button class="btn btn-primary" onclick="crearServicio()">Crear</button>
        </div>
        <table><thead><tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Duración</th><th>Acciones</th></tr></thead><tbody id="tabla-servicios"><tr><td colspan="5" class="no-data">Cargando...</td></tr></tbody></table>
    </div>
    <div id="sec-citas" class="section">
        <h2>📅 Todas las Citas</h2>
        <table><thead><tr><th>ID</th><th>Cliente</th><th>Barbero</th><th>Servicio</th><th>Fecha</th><th>Hora</th><th>Estado</th></tr></thead><tbody id="tabla-citas"><tr><td colspan="7" class="no-data">Cargando...</td></tr></tbody></table>
    </div>
</div>
<script>
    let token = localStorage.getItem('token'), rol = localStorage.getItem('rol'), refreshToken = localStorage.getItem('refresh');
    if (!token || rol !== 'ADM') window.location.href = '/';
    async function refrescarToken(){
        if(!refreshToken) return false;
        try{
            const r = await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:refreshToken})});
            if(!r.ok) return false;
            const d = await r.json();
            token = d.access; localStorage.setItem('token',token);
            refreshToken = d.refresh||refreshToken; localStorage.setItem('refresh',refreshToken);
            return true;
        }catch(e){ return false; }
    }
    document.getElementById('badge-rol').innerText = '👑 ' + rol;
    window.onload = function(){ cargarUsuarios(); cargarServicios(); cargarCitas(); setInterval(refrescarToken,55*60*1000); };
    function mostrarSeccion(s,btn){
        document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
        document.getElementById('sec-'+s).classList.add('active');
        if(btn) btn.classList.add('active');
    }
    function cerrarSesion(){ localStorage.clear(); window.location.href='/'; }
    function clearErrors(prefix){
        document.querySelectorAll(`[id^="err-${prefix}"]`).forEach(e=>e.textContent='');
    }
    async function crearUsuario(){
        clearErrors('usr');
        const nombre=document.getElementById('usr-nombre').value.trim();
        const email=document.getElementById('usr-email').value.trim();
        const password=document.getElementById('usr-password').value;
        const rol=document.getElementById('usr-rol').value;
        let ok=true;
        if(!nombre){document.getElementById('err-usr-nombre').textContent='Obligatorio';ok=false}
        if(!email){document.getElementById('err-usr-email').textContent='Obligatorio';ok=false}
        if(!password||password.length<6){document.getElementById('err-usr-password').textContent='Mín. 6 caracteres';ok=false}
        if(!ok) return;
        try {
            const r = await fetch('/api/usuarios',{
                method:'POST',
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body:JSON.stringify({nombre,email,password,rol})
            });
            if(r.ok){ await Swal.fire({icon:'success',title:'Usuario creado',timer:1500,background:'#1a1a1a',color:'#f0f0f0',showConfirmButton:false}); document.getElementById('usr-nombre').value='';document.getElementById('usr-email').value='';document.getElementById('usr-password').value=''; cargarUsuarios(); }
            else { const d=await r.json(); await Swal.fire({icon:'error',title:'Error',text:d.error||d.message||JSON.stringify(d),background:'#1a1a1a',color:'#f0f0f0'}); }
        }catch(e){ await Swal.fire({icon:'error',title:'Error de conexión',background:'#1a1a1a',color:'#f0f0f0'}); }
    }
    async function cargarUsuarios(){
        try {
            const r = await fetch('/api/usuarios',{headers:{'Authorization':'Bearer '+token}});
            const usuarios = await r.json();
            const t = document.getElementById('tabla-usuarios');
            if(!usuarios.length){t.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:#666;">Sin usuarios</td></tr>';return;}
            t.innerHTML='';
            usuarios.forEach(u=>{
                const rolBadge = u.rol==='ADM'?'badge-adm':u.rol==='BARBERO'?'badge-barbero':'badge-cliente';
                t.innerHTML+=`<tr><td>${u.id}</td><td><strong>${u.nombre}</strong></td><td>${u.email}</td><td><span class="badge ${rolBadge}">${u.rol}</span></td><td>${u.estado||'ACTIVO'}</td><td class="wrap-btn"><button class="btn btn-warning btn-sm" onclick="cambiarRol(${u.id})">Cambiar Rol</button><button class="btn btn-danger btn-sm" onclick="toggleEstado(${u.id})">${u.estado==='ACTIVO'?'Bloquear':'Activar'}</button></td></tr>`;
            });
        }catch(e){}
    }
    async function cambiarRol(id){
        const roles = ['CLIENTE','BARBERO','ADM'];
        const {value} = await Swal.fire({
            title:'Cambiar Rol',
            input:'select',
            inputOptions: roles.reduce((a,r,i)=>(a[i]=r,a),{}),
            background:'#1a1a1a',color:'#f0f0f0',
            showCancelButton:true,confirmButtonText:'Guardar',cancelButtonText:'Cancelar'
        });
        if(value===undefined) return;
        try {
            const r = await fetch('/api/usuarios/'+id+'/cambiar_rol',{
                method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body:JSON.stringify({rol:roles[value]})
            });
            if(r.ok){await Swal.fire({icon:'success',title:'Rol actualizado',timer:1200,background:'#1a1a1a',color:'#f0f0f0',showConfirmButton:false}); cargarUsuarios();}
            else {const d=await r.json(); await Swal.fire({icon:'error',title:'Error',text:d.error||d.message,background:'#1a1a1a',color:'#f0f0f0'});}
        }catch(e){}
    }
    async function toggleEstado(id){
        try {
            const r = await fetch('/api/usuarios/'+id+'/toggle_estado',{
                method:'PATCH',headers:{'Authorization':'Bearer '+token}
            });
            if(r.ok){ cargarUsuarios(); }
        }catch(e){}
    }
    async function crearServicio(){
        clearErrors('srv');
        const nombre=document.getElementById('srv-nombre').value.trim();
        const descripcion=document.getElementById('srv-descripcion').value.trim();
        const precio=parseFloat(document.getElementById('srv-precio').value);
        const duracion=parseInt(document.getElementById('srv-duracion').value);
        let ok=true;
        if(!nombre){document.getElementById('err-srv-nombre').textContent='Obligatorio';ok=false}
        if(!descripcion){document.getElementById('err-srv-descripcion').textContent='Obligatorio';ok=false}
        if(!precio||precio<=0){document.getElementById('err-srv-precio').textContent='Debe ser > 0';ok=false}
        if(!duracion||duracion<5){document.getElementById('err-srv-duracion').textContent='Mín 5 minutos';ok=false}
        if(!ok) return;
        try {
            const r = await fetch('/api/servicios',{
                method:'POST',
                headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                body:JSON.stringify({nombre,descripcion,precio,duracion_minutos:duracion})
            });
            if(r.ok){
                await Swal.fire({icon:'success',title:'Servicio creado',timer:1500,background:'#1a1a1a',color:'#f0f0f0',showConfirmButton:false});
                document.getElementById('srv-nombre').value='';document.getElementById('srv-descripcion').value='';document.getElementById('srv-precio').value='';document.getElementById('srv-duracion').value='';
                cargarServicios();
            } else { const d=await r.json(); await Swal.fire({icon:'error',title:'Error',text:d.error||d.message||JSON.stringify(d),background:'#1a1a1a',color:'#f0f0f0'}); }
        }catch(e){}
    }
    async function cargarServicios(){
        try {
            const r = await fetch('/api/servicios'); const servicios = await r.json();
            const t = document.getElementById('tabla-servicios');
            if(!servicios.length){t.innerHTML='<tr><td colspan="5" style="text-align:center;padding:30px;color:#666;">Sin servicios</td></tr>';return;}
            t.innerHTML='';
            servicios.forEach(s=>{
                t.innerHTML+=`<tr><td><strong>${s.nombre}</strong></td><td>${(s.descripcion||'').substring(0,60)}</td><td>$${s.precio}</td><td>${s.duracion_minutos} min</td><td class="wrap-btn"><button class="btn btn-warning btn-sm" onclick="editarServicio(${s.id})">Editar</button><button class="btn btn-danger btn-sm" onclick="eliminarServicio(${s.id})">Eliminar</button></td></tr>`;
            });
        }catch(e){}
    }
    async function eliminarServicio(id){
        const r = await Swal.fire({title:'¿Eliminar servicio?',icon:'warning',background:'#1a1a1a',color:'#f0f0f0',showCancelButton:true,confirmButtonText:'Sí',cancelButtonText:'No'});
        if(!r.isConfirmed) return;
        try {
            const res = await fetch('/api/servicios/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
            if(res.ok){ await Swal.fire({icon:'success',title:'Eliminado',timer:1500,background:'#1a1a1a',color:'#f0f0f0',showConfirmButton:false}); cargarServicios(); }
            else { const d=await res.json(); await Swal.fire({icon:'error',title:'Error',text:d.error||d.message,background:'#1a1a1a',color:'#f0f0f0'}); }
        }catch(e){}
    }
    async function editarServicio(id){
        const r = await fetch('/api/servicios/'+id); const s = await r.json();
        const {value: form} = await Swal.fire({
            title:'Editar Servicio',
            html:`<div style="background:#1a1a1a;padding:10px;"><input id="swal-nombre" class="swal2-input" placeholder="Nombre" value="${s.nombre}"><textarea id="swal-descripcion" class="swal2-input" style="height:60px" placeholder="Descripción">${s.descripcion||''}</textarea><input id="swal-precio" class="swal2-input" type="number" step="0.01" placeholder="Precio" value="${s.precio}"><input id="swal-duracion" class="swal2-input" type="number" placeholder="Duración (min)" value="${s.duracion_minutos}"></div>`,
            focusConfirm:false,preConfirm:()=>{
                const nombre=document.getElementById('swal-nombre').value.trim();
                if(!nombre){Swal.showValidationMessage('Nombre obligatorio');return false;}
                const descripcion=document.getElementById('swal-descripcion').value.trim();
                const precio=parseFloat(document.getElementById('swal-precio').value);
                if(!precio||precio<=0){Swal.showValidationMessage('Precio inválido');return false;}
                const duracion=parseInt(document.getElementById('swal-duracion').value);
                if(!duracion||duracion<5){Swal.showValidationMessage('Duración inválida');return false;}
                return {nombre,descripcion,precio,duracion_minutos:duracion};
            },
            background:'#1a1a1a',color:'#f0f0f0',confirmButtonText:'Guardar',cancelButtonText:'Cancelar',showCancelButton:true
        });
        if(!form) return;
        const res = await fetch('/api/servicios/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(form)});
        if(res.ok){ await Swal.fire({icon:'success',title:'Servicio actualizado',timer:1500,background:'#1a1a1a',color:'#f0f0f0',showConfirmButton:false}); cargarServicios(); }
        else { const d=await res.json(); await Swal.fire({icon:'error',title:'Error',text:d.error||d.message,background:'#1a1a1a',color:'#f0f0f0'}); }
    }
    async function cargarCitas(){
        try {
            const r = await fetch('/api/citas',{headers:{'Authorization':'Bearer '+token}}); const citas = await r.json();
            const t = document.getElementById('tabla-citas');
            if(!citas.length){t.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px;color:#666;">Sin citas</td></tr>';return;}
            t.innerHTML='';
            citas.forEach(c=>{
                t.innerHTML+=`<tr><td>${c.id}</td><td>${c.cliente?.nombre||'N/A'}</td><td>${c.barbero?.nombre||'N/A'}</td><td>${c.servicio?.nombre||'N/A'}</td><td>${c.fecha}</td><td>${c.hora}</td><td><span class="badge badge-barbero">${c.estado}</span></td></tr>`;
            });
        }catch(e){}
    }
</script>
</body>
</html>
