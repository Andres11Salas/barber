<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard - Barbería VIP</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #c9a84c;
            --accent-light: #e8c65a;
            --gold-gradient: linear-gradient(135deg, #c9a84c, #e8c65a, #c9a84c);
            --bg-dark: #111;
            --bg-card: #1a1a1a;
            --text-light: #f0f0f0;
            --text-muted: #999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
        }

        .header {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header div { display: flex; gap: 12px; align-items: center; }
        #nombre-usuario { color: var(--accent); font-weight: 600; font-size: 14px; }

        .tabs-container {
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            padding: 0 15px;
            display: flex;
            gap: 3px;
            position: sticky;
            top: 56px;
            z-index: 99;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
            font-size: 14px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-btn:hover { color: var(--accent); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 25px 15px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        h2 {
            font-family: 'Oswald', sans-serif;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(201,168,76,0.15);
            max-width: 600px;
        }
        .profile-header { display: flex; gap: 20px; margin-bottom: 25px; align-items: center; }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--gold-gradient);
            color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 700;
        }
        .profile-info h3 { color: var(--accent); margin-bottom: 3px; }
        .profile-info p { color: var(--text-muted); font-size: 13px; margin: 2px 0; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #333;
            border-radius: 6px; font-family: inherit; font-size: 14px;
            background: #222; color: #f0f0f0;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(201,168,76,0.15);
        }
        .form-group textarea { resize: vertical; min-height: 70px; }

        .servicios-grid, .barberos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 15px;
        }
        .service-card, .barbero-card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(201,168,76,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .service-card:hover, .barbero-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(201,168,76,0.1);
        }
        .service-image, .barbero-header {
            width: 100%; height: 180px; object-fit: cover;
        }
        .service-info, .barbero-content { padding: 16px; }
        .service-info h3, .barbero-header h3 {
            font-family: 'Oswald', sans-serif;
            color: var(--accent); text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 5px;
        }
        .service-price {
            font-size: 22px; font-weight: 700;
            color: var(--accent-light); margin: 8px 0;
        }
        .barbero-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 25px 16px; text-align: center;
            color: var(--accent);
        }
        .barbero-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(201,168,76,0.2);
            margin: 0 auto 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; border: 2px solid var(--accent);
        }
        .barbero-info { font-size: 13px; color: var(--text-muted); margin: 6px 0; }

        .citas-table {
            width: 100%; background: var(--bg-card);
            border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(201,168,76,0.1);
            margin-top: 15px;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #0a0a0a; }
        th { padding: 12px 15px; text-align: left; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
        td { padding: 12px 15px; border-bottom: 1px solid #222; font-size: 14px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .modal-close {
            position: absolute; top: 20px; right: 30px;
            color: white; font-size: 36px; cursor: pointer; transition: 0.3s;
        }
        .modal-close:hover { color: var(--accent); }
        tbody tr:hover { background: rgba(201,168,76,0.05); }

        .btn {
            padding: 8px 16px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: var(--gold-gradient); color: #000; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .btn-small { padding: 5px 10px; font-size: 11px; }
        .btn-block { width: 100%; }

        .no-data { text-align: center; padding: 40px; color: var(--text-muted); }

        .publicacion { background: var(--bg-card); border-radius: 10px; border: 1px solid rgba(201,168,76,0.1); margin-bottom: 18px; overflow: hidden; }
        .pub-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .pub-header h3 { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: 15px; }
        .pub-header small { color: #555; font-size: 11px; }
        .pub-desc { padding: 0 16px 10px; color: #ccc; font-size: 14px; }
        .pub-media { width: 100%; max-height: 500px; object-fit: cover; cursor: pointer; transition: 0.3s; display: block; }
        .pub-media:hover { opacity: 0.9; }
        .pub-actions { padding: 10px 16px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #222; }
        .pub-actions button { background: none; border: none; color: #888; cursor: pointer; font-size: 15px; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .pub-actions button:hover { color: var(--accent); }
        .pub-actions .liked { color: var(--accent); }
        .comentarios { padding: 0 16px 14px; }
        .comentario { padding: 6px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        .comentario-user { color: var(--accent); font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; }
        .comentario-delete { color: #c0392b; cursor: pointer; font-size: 11px; }
        .comentario-texto { color: #ccc; margin-top: 2px; }
        .comentario-input { display: flex; gap: 8px; margin-top: 8px; }
        .comentario-input input { flex: 1; padding: 8px; border: 1px solid #333; border-radius: 5px; background: #222; color: #f0f0f0; font-size: 13px; }
        .comentario-input input:focus { border-color: var(--accent); outline: none; }
        .comentario-input button { padding: 8px 14px; background: var(--gold-gradient); color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 12px; }

        @media (max-width: 768px) {
            .header { padding: 10px 15px; flex-direction: column; gap: 8px; }
            .tabs-container { top: 90px; }
            .profile-header { flex-direction: column; text-align: center; }
            .servicios-grid, .barberos-grid { grid-template-columns: 1fr; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>✂️ Barbería VIP</h1>
    <div>
        <span id="nombre-usuario"></span>
        <button class="btn btn-danger btn-small" onclick="cerrarSesion()">Salir</button>
    </div>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="mostrarSeccion('perfil', this)">👤 Perfil</button>
    <button class="tab-btn" onclick="mostrarSeccion('servicios', this)">✂️ Servicios</button>
    <button class="tab-btn" onclick="mostrarSeccion('barberos', this)">💇 Barberos</button>
    <button class="tab-btn" onclick="mostrarSeccion('citas', this)">📅 Citas</button>
    <button class="tab-btn" onclick="mostrarSeccion('galeria', this)">📸 Galería</button>
</div>

<div class="container">
    <div id="sec-perfil" class="section active">
        <h2>👤 Mi Perfil</h2>
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar" id="avatar">👤</div>
                <div class="profile-info">
                    <h3 id="perfil-nombre">Cargando...</h3>
                    <p id="perfil-rol">Cliente</p>
                    <p style="font-size:12px;color:#666;">ID: <span id="perfil-id">-</span></p>
                </div>
            </div>
            <div class="form-group"><label>Nombre</label><input type="text" id="input-nombre" /></div>
            <div class="form-group"><label>Email</label><input type="email" id="input-email" /></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" id="input-telefono" /></div>
            <div class="form-group"><label>Biografía</label><textarea id="input-bio"></textarea></div>
            <button class="btn btn-primary btn-block" onclick="guardarPerfil()">💾 Guardar</button>
        </div>
    </div>

    <div id="sec-servicios" class="section">
        <h2>✂️ Servicios</h2>
        <div id="servicios-container" class="servicios-grid"><div class="no-data">Cargando...</div></div>
    </div>

    <div id="sec-barberos" class="section">
        <h2>💇 Barberos</h2>
        <div id="barberos-container" class="barberos-grid"><div class="no-data">Cargando...</div></div>
    </div>

    <div id="sec-citas" class="section">
        <h2>📅 Mis Citas</h2>
        <div class="citas-table">
            <table>
                <thead><tr>
                    <th>Fecha/Hora</th><th>Barbero</th><th>Servicio</th><th>Precio</th><th>Acción</th>
                </tr></thead>
                <tbody id="tabla-citas"><tr><td colspan="5" style="text-align:center;padding:30px;color:#666;">Cargando...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="sec-galeria" class="section">
        <h2>📸 Galería de Trabajos</h2>
        <div id="publicaciones-container"><div class="no-data">Cargando...</div></div>
    </div>
</div>

<div id="media-modal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modal-media" src="" alt="Media">
</div>

<script>
    let usuarioId = null;

    window.onload = () => {
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');
        if (!token || rol !== 'CLIENTE') { window.location.href = '/'; return; }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            usuarioId = payload.id || payload.user_id;
        } catch(e) {
            window.location.href = '/';
            return;
        }

        document.getElementById('nombre-usuario').innerText = localStorage.getItem('nombre') || 'Usuario';
        cargarPerfil();
        cargarServicios();
        cargarBarberos();
        cargarCitas();
    };

    function mostrarSeccion(seccion, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-' + seccion).classList.add('active');
        if (btn) btn.classList.add('active');
        if (seccion === 'galeria') cargarPublicaciones();
    }

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = '/';
    }

    async function cargarPerfil() {
        try {
            const res = await fetch('/api/usuarios/' + usuarioId);
            if (!res.ok) return Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo cargar el perfil' });
            const u = await res.json();
            document.getElementById('avatar').innerText = (u.nombre || '?').charAt(0).toUpperCase();
            document.getElementById('perfil-nombre').innerText = u.nombre;
            document.getElementById('perfil-id').innerText = u.id;
            document.getElementById('perfil-rol').innerText = u.rol;
            document.getElementById('input-nombre').value = u.nombre || '';
            document.getElementById('input-email').value = u.email || '';
            document.getElementById('input-telefono').value = u.telefono || '';
            document.getElementById('input-bio').value = u.bio || '';
        } catch (e) { console.error('Error perfil:', e); }
    }

    async function guardarPerfil() {
        const token = localStorage.getItem('token');
        const body = {
            nombre: document.getElementById('input-nombre').value,
            telefono: document.getElementById('input-telefono').value,
            bio: document.getElementById('input-bio').value
        };
        try {
            const res = await fetch('/api/usuarios/mi_perfil', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                localStorage.setItem('nombre', body.nombre);
                await Swal.fire({ icon: 'success', title: 'Perfil actualizado', timer: 1500, showConfirmButton: false, background: '#1a1a1a', color: '#f0f0f0' });
                cargarPerfil();
            } else {
                const err = await res.json();
                const msg = Object.values(err).flat().join(', ') || 'Error al guardar';
                await Swal.fire({ icon: 'error', title: 'Error', text: msg, background: '#1a1a1a', color: '#f0f0f0' });
            }
        } catch (e) {
            await Swal.fire({ icon: 'error', title: 'Error', text: 'Error al conectar', background: '#1a1a1a', color: '#f0f0f0' });
        }
    }

    const servicioImages = {
        'corte': 'https://images.unsplash.com/photo-1599407367267-f3a1df6cd13b?w=600&q=80',
        'barba': 'https://images.unsplash.com/photo-1595617707802-a9403604ff04?w=600&q=80',
        'fade': 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=80',
        'degrado': 'https://images.unsplash.com/photo-1567894340315-735d7c361db7?w=600&q=80',
        'clasico': 'https://images.unsplash.com/photo-1599407367267-f3a1df6cd13b?w=600&q=80',
        'cej': 'https://images.unsplash.com/photo-1621605815971-fbc98d665666?w=600&q=80',
        'default': 'https://images.unsplash.com/photo-1537639507592-cc4467fb1923?w=600&q=80'
    };

    function obtenerImagenServicio(nombre) {
        const n = nombre.toLowerCase();
        for (const [k, v] of Object.entries(servicioImages)) {
            if (k !== 'default' && n.includes(k)) return v;
        }
        return servicioImages.default;
    }

    async function cargarServicios() {
        try {
            const res = await fetch('/api/servicios');
            const servicios = await res.json();
            const container = document.getElementById('servicios-container');
            if (!servicios || servicios.length === 0) {
                container.innerHTML = '<div class="no-data">No hay servicios</div>'; return;
            }
            container.innerHTML = '';
            servicios.forEach(s => {
                container.innerHTML += `
                    <div class="service-card">
                        <img src="${obtenerImagenServicio(s.nombre)}" alt="${s.nombre}" class="service-image" loading="lazy">
                        <div class="service-info">
                            <h3>${s.nombre}</h3>
                            <p style="color:#999;font-size:13px;">${s.descripcion || 'Servicio profesional'}</p>
                            <div class="service-price">$${Number(s.precio).toLocaleString('es-CO')} <small style="font-size:11px;color:#666;">COP</small></div>
                            <p style="font-size:12px;color:#666;">⏱️ ${s.duracion_minutos} min</p>
                            <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="mostrarFormularioReserva(${s.id})">Agendar</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) { console.error('Error servicios:', e); }
    }

    async function cargarBarberos() {
        try {
            const res = await fetch('/api/usuarios');
            const usuarios = await res.json();
            const barberos = usuarios.filter(u => u.rol === 'BARBERO' || u.rol === 'ADM');
            const container = document.getElementById('barberos-container');
            if (barberos.length === 0) { container.innerHTML = '<div class="no-data">No hay barberos</div>'; return; }
            container.innerHTML = '';
            barberos.forEach(b => {
                container.innerHTML += `
                    <div class="barbero-card">
                        <div class="barbero-header">
                            <div class="barbero-avatar">${(b.nombre||'?').charAt(0).toUpperCase()}</div>
                            <h3>${b.nombre}</h3>
                            <p style="font-size:11px;opacity:0.7;">Barbero Profesional</p>
                        </div>
                        <div class="barbero-content">
                            <div class="barbero-info">📧 ${b.email}</div>
                            <div class="barbero-info">📞 ${b.telefono || 'No disponible'}</div>
                            <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="verPerfil(${b.id})">Ver Perfil</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) { console.error('Error barberos:', e); }
    }

    async function cargarCitas() {
        try {
            const res = await fetch('/api/citas');
            let citas = await res.json();
            citas = citas.filter(c => c.cliente_id === usuarioId);
            const tbody = document.getElementById('tabla-citas');
            if (citas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#666;">Sin citas. ¡Agenda una!</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            citas.forEach(c => {
                const precio = c.servicio?.precio ? Number(c.servicio.precio).toLocaleString('es-CO') : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${c.fecha}</strong><br><small style="color:#666;">${c.hora}</small></td>
                        <td>💈 ${c.barbero?.nombre || 'N/A'}</td>
                        <td>✂️ ${c.servicio?.nombre || 'N/A'}</td>
                        <td>$${precio}</td>
                        <td>
                            <button class="btn btn-danger btn-small" onclick="cancelarCita(${c.id})">Cancelar</button>
                            <button class="btn btn-primary btn-small" style="margin-left:5px;" onclick="pagarCita(${c.id}, ${c.servicio?.precio || 0})">Pagar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) { console.error('Error citas:', e); }
    }

    let bookingServicioId = null;
    let bookingBarberos = [];

    async function mostrarFormularioReserva(servicioId) {
        bookingServicioId = servicioId;
        const hoy = new Date().toISOString().split('T')[0];

        try {
            const res = await fetch(`/api/servicios`);
            const servicios = await res.json();
            const serv = servicios.find(s => s.id === servicioId);
            const precio = serv ? Number(serv.precio).toLocaleString('es-CO') : '';

            Swal.fire({
                title: '✂️ Agendar Cita',
                html: `
                    <div style="text-align:left;margin-bottom:12px;color:var(--accent);font-weight:600;">
                        ${serv ? serv.nombre : 'Servicio'} — $${precio} COP
                        ${serv ? '<br><small style="color:#888;">⏱️ ' + serv.duracion_minutos + ' min</small>' : ''}
                    </div>
                    <label style="color:#aaa;font-size:12px;display:block;text-align:left;">Fecha</label>
                    <input type="date" id="swal-fecha" class="swal2-input" min="${hoy}" style="width:100%;">
                    <label id="swal-barbero-label" style="color:#aaa;font-size:12px;display:none;text-align:left;margin-top:8px;">Barbero</label>
                    <select id="swal-barbero" class="swal2-input" style="width:100%;display:none;background:#222;color:#f0f0f0;border:1px solid #333;padding:10px;border-radius:6px;">
                        <option value="">Selecciona fecha primero</option>
                    </select>
                    <label id="swal-hora-label" style="color:#aaa;font-size:12px;display:none;text-align:left;margin-top:8px;">Hora</label>
                    <select id="swal-hora" class="swal2-input" style="width:100%;display:none;background:#222;color:#f0f0f0;border:1px solid #333;padding:10px;border-radius:6px;">
                        <option value="">Selecciona barbero primero</option>
                    </select>
                    <div id="swal-booking-info" style="margin-top:10px;font-size:12px;color:#888;text-align:center;"></div>
                `,
                confirmButtonText: 'Confirmar Cita',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#c9a84c',
                cancelButtonColor: '#666',
                background: '#1a1a1a', color: '#f0f0f0',
                didOpen: () => {
                    document.getElementById('swal-fecha').addEventListener('change', async function() {
                        const fecha = this.value;
                        if (!fecha) return;
                        document.getElementById('swal-booking-info').innerText = 'Cargando barberos...';
                        try {
                            const r = await fetch(`/api/citas/barberos_disponibles?fecha=${fecha}&servicio_id=${servicioId}`);
                            const data = await r.json();
                            bookingBarberos = data.barberos || [];
                            const sel = document.getElementById('swal-barbero');
                            sel.style.display = 'block';
                            document.getElementById('swal-barbero-label').style.display = 'block';
                            sel.innerHTML = '<option value="">Selecciona un barbero</option>';
                            bookingBarberos.forEach(b => {
                                sel.innerHTML += `<option value="${b.id}">💈 ${b.nombre} (${b.citas_count} citas hoy)</option>`;
                            });
                            document.getElementById('swal-booking-info').innerText = `${bookingBarberos.length} barbero(s) disponible(s) el ${fecha}`;
                        } catch(e) {
                            document.getElementById('swal-booking-info').innerText = 'Error al cargar barberos';
                        }
                    });

                    document.getElementById('swal-barbero').addEventListener('change', async function() {
                        const barberoId = this.value;
                        const fecha = document.getElementById('swal-fecha').value;
                        if (!barberoId || !fecha) return;
                        document.getElementById('swal-booking-info').innerText = 'Cargando horarios...';
                        try {
                            const r = await fetch(`/api/citas/horarios_disponibles?fecha=${fecha}&barbero_id=${barberoId}&servicio_id=${bookingServicioId}`);
                            const data = await r.json();
                            const sel = document.getElementById('swal-hora');
                            sel.style.display = 'block';
                            document.getElementById('swal-hora-label').style.display = 'block';
                            sel.innerHTML = '<option value="">Selecciona una hora</option>';
                            (data.horarios || []).forEach(h => {
                                sel.innerHTML += `<option value="${h.hora}">${h.display}</option>`;
                            });
                            document.getElementById('swal-booking-info').innerText = `${data.horarios.length} horario(s) disponible(s)`;
                        } catch(e) {
                            document.getElementById('swal-booking-info').innerText = 'Error al cargar horarios';
                        }
                    });
                },
                preConfirm: () => {
                    const fecha = document.getElementById('swal-fecha').value;
                    const barberoId = document.getElementById('swal-barbero').value;
                    const hora = document.getElementById('swal-hora').value;
                    if (!fecha) { Swal.showValidationMessage('Selecciona una fecha'); return false; }
                    if (!barberoId) { Swal.showValidationMessage('Selecciona un barbero'); return false; }
                    if (!hora) { Swal.showValidationMessage('Selecciona una hora'); return false; }
                    return { fecha, barberoId: parseInt(barberoId), hora };
                }
            }).then(result => {
                if (result.isConfirmed) {
                    confirmarReserva(servicioId, result.value.barberoId, result.value.fecha, result.value.hora);
                }
            });
        } catch(e) {
            await Swal.fire({ icon: 'error', title: 'Error', text: 'Error al cargar servicios', background: '#1a1a1a', color: '#f0f0f0' });
        }
    }

    async function confirmarReserva(servicioId, barberoId, fecha, hora) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/citas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ cliente_id: usuarioId, barbero_id: barberoId, servicio_id: servicioId, fecha, hora })
            });
            const data = await res.json();
            if (res.ok) {
                await Swal.fire({ icon: 'success', title: '✅ Cita Agendada', html: `Con el barbero <strong>#${barberoId}</strong> el <strong>${fecha}</strong> a las <strong>${hora}</strong>`, timer: 2500, showConfirmButton: false, background: '#1a1a1a', color: '#f0f0f0' });
                cargarCitas();
                document.querySelectorAll('.tab-btn')[3].click();
            } else {
                let msg = data.error || data.message || 'Error al agendar';
                if (data.error && Array.isArray(data.error)) msg = data.error.join(', ');
                await Swal.fire({ icon: 'error', title: 'Error', text: msg, background: '#1a1a1a', color: '#f0f0f0' });
            }
        } catch (e) {
            await Swal.fire({ icon: 'error', title: 'Error de conexión', text: 'No se pudo conectar con el servidor.', background: '#1a1a1a', color: '#f0f0f0' });
        }
    }

    async function cancelarCita(citaId) {
        const result = await Swal.fire({ title: '¿Cancelar cita?', text: 'Esta acción no se puede deshacer', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, cancelar', cancelButtonText: 'No', background: '#1a1a1a', color: '#f0f0f0' });
        if (!result.isConfirmed) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/citas/cliente/' + citaId, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                await Swal.fire({ icon: 'success', title: 'Cita cancelada', timer: 1500, showConfirmButton: false, background: '#1a1a1a', color: '#f0f0f0' });
                cargarCitas();
            } else {
                const err = await res.json();
                await Swal.fire({ icon: 'error', title: 'Error', text: err.error || err.message, background: '#1a1a1a', color: '#f0f0f0' });
            }
        } catch (e) {
            await Swal.fire({ icon: 'error', title: 'Error', text: 'Error de conexión', background: '#1a1a1a', color: '#f0f0f0' });
        }
    }

    function verPerfil(id) { window.location.href = '/perfil-barbero.html?id=' + id; }

    function abrirMedia(src) { document.getElementById('modal-media').src = src; document.getElementById('media-modal').classList.add('active'); }
    function cerrarModal() { document.getElementById('media-modal').classList.remove('active'); }

    async function cargarPublicaciones() {
        try {
            const res = await fetch('/api/publicaciones');
            const pubs = await res.json();
            const c = document.getElementById('publicaciones-container');
            if (!pubs || pubs.length === 0) { c.innerHTML = '<div class="no-data">No hay publicaciones aún</div>'; return; }
            c.innerHTML = '';
            pubs.forEach(pub => {
                const contenido = pub.contenido_json || {};
                const mediaUrl = contenido.imagen || contenido.url || '';
                c.innerHTML += `
                    <div class="publicacion">
                        <div class="pub-header">
                            <h3>${pub.titulo || 'Sin título'}</h3>
                            <small>${pub.barbero?.nombre || 'Barbero'} · ${new Date(pub.createdAt).toLocaleDateString('es-CO')}</small>
                        </div>
                        ${pub.descripcion ? `<div class="pub-desc">${pub.descripcion}</div>` : ''}
                        ${mediaUrl ? `<img src="${mediaUrl}" alt="Media" class="pub-media" onclick="abrirMedia('${mediaUrl.replace(/'/g, "\\'")}')">` : ''}
                        <div class="pub-actions">
                            <button class="${usuarioId && pub.user_reaction === 'like' ? 'liked' : ''}" onclick="agregarReaccion(${pub.id}, 'like')">👍 ${pub.likes_count || 0}</button>
                            <button class="${usuarioId && pub.user_reaction === 'dislike' ? 'liked' : ''}" onclick="agregarReaccion(${pub.id}, 'dislike')">👎 ${pub.dislikes_count || 0}</button>
                        </div>
                        <div class="comentarios">
                            ${(pub.comentarios || []).map(com => `
                                <div class="comentario">
                                    <div class="comentario-user">
                                        ${com.usuario?.nombre || 'Anónimo'}
                                        ${com.usuario_id === usuarioId ? `<span class="comentario-delete" onclick="eliminarComentario(${com.id})">eliminar</span>` : ''}
                                    </div>
                                    <div class="comentario-texto">${com.texto}</div>
                                </div>
                            `).join('')}
                            <div class="comentario-input">
                                <input type="text" id="comentario-input-${pub.id}" placeholder="Escribe un comentario..." />
                                <button onclick="agregarComentario(${pub.id})">Enviar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch(e) { document.getElementById('publicaciones-container').innerHTML = '<div class="no-data">Error al cargar</div>'; }
    }

    async function agregarReaccion(pubId, tipo) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/publicaciones/' + pubId + '/reacciones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ tipo })
            });
            if (res.ok) cargarPublicaciones();
        } catch(e) { console.error(e); }
    }

    async function agregarComentario(pubId) {
        const input = document.getElementById('comentario-input-' + pubId);
        const texto = input.value.trim();
        if (!texto) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/publicaciones/' + pubId + '/comentarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ texto })
            });
            if (res.ok) { input.value = ''; cargarPublicaciones(); }
        } catch(e) { console.error(e); }
    }

    async function eliminarComentario(comId) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/publicaciones/comentarios/' + comId, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) cargarPublicaciones();
        } catch(e) { console.error(e); }
    }
</script>
