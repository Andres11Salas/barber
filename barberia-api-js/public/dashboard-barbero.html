<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería - Mi Panel de Barbero</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: transparent; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(0,0,0,0.04); padding-bottom: 10px; margin-bottom: 20px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background-color: #ecf0f1; cursor: pointer; border-radius: 6px; font-weight: 700; transition: 0.18s; }
        .tab-btn:hover { background-color: #f1f4f7; }
        .tab-btn.active { background-color: var(--brand-blue); color: white; }

        .section { display: none; }
        .section.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--brand-blue); color: white; }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 700; }
        .btn-primary { background-color: var(--brand-light-blue); }
        .btn-danger { background-color: var(--brand-red); }
        .btn-success { background-color: #27ae60; }
        .hidden { display: none !important; }

        .perfil-card { background: #fafafa; border: 1px solid #f0f0f0; padding: 20px; border-radius: 8px; max-width: 420px; }
        input, select, textarea { width: calc(100% - 24px); padding: 10px; margin: 5px 0 15px 0; border: 1px solid #e6e6e9; border-radius: 6px; }
        textarea { resize: vertical; min-height: 80px; }

        .badge-rol{ background: var(--brand-red); color: white; padding: 6px 12px; border-radius: 16px; font-size: 13px; }
        .field-error{ color: var(--brand-red); font-size:12px; margin-top:6px; display:block; }

        .pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .pub-card { background: #f9fafb; border: 1px solid #eee; border-radius: 8px; padding: 15px; }
        .pub-card h4 { margin: 0 0 10px 0; color: var(--brand-blue); }
        .pub-card p { margin: 5px 0; font-size: 13px; }
    </style>
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>

<div class="container">
    <div class="header">
        <a href="/" style="text-decoration: none; color: #2c3e50;"><h1>💈 Mi Panel de Barbero</h1></a>
        <div>
            <span id="badge-rol" class="badge-rol" style="margin-right: 15px;"></span>
            <button class="btn btn-danger" onclick="cerrarSesion()">Salir</button>
        </div>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="mostrarSeccion('perfil')">👤 Mi Perfil</button>
        <button class="tab-btn" onclick="mostrarSeccion('citas')">📅 Mis Citas</button>
        <button class="tab-btn" onclick="mostrarSeccion('publicaciones')">📸 Mis Publicaciones</button>
    </div>

    <!-- SECCIÓN: MI PERFIL -->
    <div id="sec-perfil" class="section active">
        <h2>Información de tu Cuenta</h2>
        <div class="perfil-card">
            <p><strong>ID de Empleado:</strong> <span id="perfil-id">...</span></p>
            <p><strong>Nombre:</strong> <span id="perfil-nombre">...</span></p>
            <p><strong>Correo:</strong> <span id="perfil-email">...</span></p>
            <p><strong>Rol en el sistema:</strong> <span id="perfil-rol">...</span></p>
        </div>
    </div>

    <!-- SECCIÓN: MIS CITAS -->
    <div id="sec-citas" class="section">
        <h2>Mi Agenda de Citas</h2>
        <table>
            <thead><tr><th>Fecha y Hora</th><th>Cliente</th><th>Servicio</th><th>Precio</th></tr></thead>
            <tbody id="tabla-citas"><tr><td colspan="4" style="text-align: center;">Cargando...</td></tr></tbody>
        </table>
    </div>

    <!-- SECCIÓN: PUBLICACIONES -->
    <div id="sec-publicaciones" class="section">
        <h2>Mis Publicaciones</h2>
        
        <!-- Formulario para crear publicación -->
        <div style="background:#f8fafc;padding:15px;border-radius:8px;margin-bottom:20px;">
            <h3 style="margin-top: 0;">Crear Nueva Publicación</h3>
            
            <label><strong>Título</strong></label>
            <input type="text" id="pub-titulo" placeholder="Ej: Mi último corte modernista" />
            <span class="field-error" id="err-pub-titulo"></span>

            <label><strong>Descripción</strong></label>
            <textarea id="pub-descripcion" placeholder="Cuéntales sobre este trabajo..."></textarea>
            <span class="field-error" id="err-pub-descripcion"></span>

            <label><strong>Fotos (URLs separadas por coma)</strong></label>
            <input type="text" id="pub-imagenes" placeholder="https://imagen1.jpg,https://imagen2.jpg" />
            <span class="field-error" id="err-pub-imagenes"></span>

            <label><strong>Videos (URLs separadas por coma)</strong></label>
            <input type="text" id="pub-videos" placeholder="https://video1.mp4,https://video2.webm" />

            <button class="btn btn-primary" onclick="crearPublicacion()" style="width: auto;">📤 Publicar</button>
        </div>

        <h3>Mis trabajos publicados</h3>
        <div id="publicaciones-container" class="pub-grid">
            <div style="text-align: center; color: #999; padding: 20px;">Cargando publicaciones...</div>
        </div>
    </div>
</div>

<script>
    let miToken = localStorage.getItem('token');
    let miRol = localStorage.getItem('rol');
    let miId = null;

    window.onload = () => {
        if (!miToken || miRol !== 'BARBERO') {
            window.location.href = '/'; 
            return;
        }

        document.getElementById('badge-rol').innerText = 'Modo: ' + miRol;
        const payload = JSON.parse(atob(miToken.split('.')[1]));
        miId = payload.id;

        cargarPerfil();
        cargarCitas();
        cargarPublicaciones();
    };

    function mostrarSeccion(seccionId) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('sec-' + seccionId).classList.add('active');
        event.target.classList.add('active');
    }

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = '/';
    }

    async function cargarPerfil() {
        try {
            const res = await fetch(`/api/usuarios/${miId}`);
            const data = await res.json();
            document.getElementById('perfil-id').innerText = data.id;
            document.getElementById('perfil-nombre').innerText = data.nombre;
            document.getElementById('perfil-email').innerText = data.email;
            document.getElementById('perfil-rol').innerText = data.rol;
        } catch (error) { console.error("Error al cargar perfil:", error); }
    }

    async function cargarCitas() {
        try {
            const res = await fetch('/api/citas');
            let citas = await res.json();
            citas = citas.filter(cita => cita.barbero_id === miId);

            const tbody = document.getElementById('tabla-citas');
            tbody.innerHTML = '';
            
            if(citas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No tienes citas agendadas</td></tr>';
                return;
            }

            citas.forEach(c => {
                const nombreCliente = c.cliente ? c.cliente.nombre : 'Desconocido';
                const nombreServicio = c.servicio ? c.servicio.nombre : 'Desconocido';
                const precio = c.servicio ? c.servicio.precio : 'N/A';
                
                tbody.innerHTML += `<tr>
                    <td><strong>${c.fecha}</strong> <br> ${c.hora}</td>
                    <td>👤 ${nombreCliente}</td>
                    <td>✂️ ${nombreServicio}</td>
                    <td>$${precio}</td>
                </tr>`;
            });
        } catch (error) { console.error(error); }
    }

    async function cargarPublicaciones() {
        try {
            const res = await fetch(`/api/publicaciones/barbero/${miId}`);
            const publicaciones = await res.json();
            const container = document.getElementById('publicaciones-container');

            if (publicaciones.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">Aún no tienes publicaciones. ¡Crea tu primera publicación!</div>';
                return;
            }

            container.innerHTML = '';
            publicaciones.forEach(pub => {
                const html = `
                    <div class="pub-card">
                        <h4>${pub.titulo}</h4>
                        <p>${pub.descripcion.substring(0, 100)}${pub.descripcion.length > 100 ? '...' : ''}</p>
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd;">
                            <p><strong>👍 ${pub.likes_count} | 👎 ${pub.dislikes_count} | 💬 ${pub.comentarios?.length || 0}</strong></p>
                            <button class="btn btn-primary" onclick="editarPublicacion(${pub.id})" style="width: auto; margin-right: 5px;">Editar</button>
                            <button class="btn btn-danger" onclick="eliminarPublicacion(${pub.id})" style="width: auto;">Eliminar</button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        } catch (error) { console.error(error); }
    }

    function clearPublicationErrors(){
        ['titulo','descripcion','imagenes'].forEach(f=>{
            const el = document.getElementById('err-pub-'+f);
            if(el) el.innerText = '';
        });
    }

    function validatePublication(){
        let ok = true;
        const titulo = document.getElementById('pub-titulo').value.trim();
        const descripcion = document.getElementById('pub-descripcion').value.trim();

        if(!titulo){ document.getElementById('err-pub-titulo').innerText = 'El título es obligatorio.'; ok = false; }
        if(!descripcion){ document.getElementById('err-pub-descripcion').innerText = 'La descripción es obligatoria.'; ok = false; }

        return ok;
    }

    async function crearPublicacion(){
        clearPublicationErrors();
        if(!validatePublication()) return;

        const titulo = document.getElementById('pub-titulo').value.trim();
        const descripcion = document.getElementById('pub-descripcion').value.trim();
        const imagenesStr = document.getElementById('pub-imagenes').value.trim();
        const videosStr = document.getElementById('pub-videos').value.trim();

        const contenido_json = {};
        if(imagenesStr) contenido_json.imagenes = imagenesStr.split(',').map(s => s.trim()).filter(s => s);
        if(videosStr) contenido_json.videos = videosStr.split(',').map(s => s.trim()).filter(s => s);

        try {
            const res = await fetch('/api/publicaciones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${miToken}` },
                body: JSON.stringify({ titulo, descripcion, contenido_json })
            });

            if(res.ok){
                alert('¡Publicación creada exitosamente!');
                document.getElementById('pub-titulo').value = '';
                document.getElementById('pub-descripcion').value = '';
                document.getElementById('pub-imagenes').value = '';
                document.getElementById('pub-videos').value = '';
                cargarPublicaciones();
            } else {
                const data = await res.json();
                alert('Error: ' + (data.error || data.message || 'No se pudo crear'));
            }
        }catch(e){ console.error(e); alert('Error al crear publicación'); }
    }

    function editarPublicacion(pubId){
        alert('Funcionalidad de edición próximamente disponible');
    }

    async function eliminarPublicacion(pubId){
        if(!confirm('¿Eliminar esta publicación? No se puede deshacer.')) return;
        
        try {
            const res = await fetch(`/api/publicaciones/${pubId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${miToken}` }
            });

            if(res.ok){
                alert('Publicación eliminada');
                cargarPublicaciones();
            } else {
                const data = await res.json();
                alert('Error: ' + (data.error || data.message || 'No se pudo eliminar'));
            }
        }catch(e){ console.error(e); alert('Error al eliminar publicación'); }
    }
</script>

</body>
</html>
